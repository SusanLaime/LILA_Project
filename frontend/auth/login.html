<!DOCTYPE html>
<html lang="es">

<head>
    <!--
      DUEÑA/O: Natalia Arze — Inicio de sesión. Ver README.md (sección Equipo)
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <meta name="description"
        content="LILA, la red laboral de Bolivia para conectar talento, oportunidades y confianza." />
    <link rel="stylesheet" href="../assets/css/base/reset.css" />
    <link rel="stylesheet" href="../assets/css/base/typography.css" />
    <link rel="stylesheet" href="../assets/css/pages/login.css" />
    <link rel="stylesheet" href="../assets/css/components/forms.css" />
    <link rel="stylesheet" href="../assets/css/components/header.css" />
    <link rel="stylesheet" href="../assets/css/utilities/responsive.css" />
    <title>LILA | Librería Laboral</title>
</head>

<body>
    <main class="bienvenida-mvil" aria-labelledby="saludo-principal">
        <div id="header-placeholder"></div>
        <section aria-labelledby="saludo-principal">
            <h1 class="saludo" id="saludo-principal">Hola, bienvenido/a a LILA</h1>
            <p class="introducci-n">
                La red laboral de Bolivia para conectar talento, oportunidades y
                confianza.
            </p>
        </section>
        <nav aria-label="Opciones de acceso">
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="login-ci">Carnet de identidad (CI)</label>
                    <input id="login-ci" name="ci" type="text" inputmode="numeric"
                        autocomplete="username" minlength="5" maxlength="10"
                        pattern="[0-9]{5,10}" placeholder="Ej. 1234567" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Contraseña</label>
                    <div class="password-field">
                        <input id="login-password" name="password" type="password"
                            autocomplete="current-password" required>
                        <button class="password-toggle" type="button" id="toggle-password"
                            aria-controls="login-password" aria-pressed="false">
                            Mostrar
                        </button>
                    </div>
                </div>
            </form>
            <p id="login-mensaje" role="alert" aria-live="polite"></p>

            <button class="botn-ingresar ingresar" type="button" id="btn-ingresar">
                Ingresar a mi cuenta
            </button>
            <button class="botn-crear crear-cuenta" type="button" id="btn-crear">
                Crear nueva cuenta
            </button>
        </nav>
        <div style="text-align: center; margin: 40px 0 20px 0;">
            <p class="legal" style="font-size: 12px; color: #666;">
                Al continuar aceptas nuestros términos y política de privacidad.
            </p>
        </div>
        <div id="footer-placeholder"></div>
    </main>
    <script type="module" src="../assets/js/login.js"></script>
    <script type="module">
        import { initFooter, initHeader } from '../assets/js/components.js';
        initHeader('', '');
        initFooter();
    </script>
</body>

</html>
