<!DOCTYPE html>
<html lang="es">
<head>
    <!--
      DUEÑA/O: Persona 2 — Tarea T-02 (Registro). Ver docs/TAREAS.md
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <meta name="description" content="Registro en LILA" />
    <link rel="stylesheet" href="../assets/css/base/reset.css" />
    <link rel="stylesheet" href="../assets/css/base/typography.css" />
    <link rel="stylesheet" href="../assets/css/pages/login.css" />
    <link rel="stylesheet" href="../assets/css/components/forms.css" />
    <link rel="stylesheet" href="../assets/css/utilities/responsive.css" />
    <title>LILA | Registro</title>
</head>
<body>
    <main class="bienvenida-mvil auth-layout" aria-labelledby="registro-titulo">
        <header>
            <div class="fondo-lavanda" aria-hidden="true"></div>
            <img class="logotipo-oficial" src="../public/LILA-logotipo-oficial.png" alt="LILA Librería Laboral" />
        </header>
        <section aria-labelledby="registro-titulo">
            <h1 class="saludo" id="registro-titulo">Crear cuenta en LILA</h1>
            <p class="introducci-n">
                Únete a la red laboral de Bolivia. Es gratis, rápido y seguro.
            </p>
        </section>
        
        <form class="registro-form" id="registroForm">
            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required />
            </div>
            <div class="form-group">
                <label for="ci">Carnet de Identidad (CI)</label>
                <input type="text" id="ci" name="ci" placeholder="Ej. 1234567" required />
            </div>
            <div class="form-group">
                <label for="telefono">Teléfono (Celular)</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej. 70012345" required />
            </div>
            <!-- TODO (Persona 2): agregar el campo "Contraseña" (type="password", mínimo 8 caracteres). -->
            <!-- TODO (Persona 2): agregar la casilla de consentimiento (Ley 2472):
                 "Acepto el tratamiento de mis datos personales" (id="consentimiento"). -->
            <!-- TODO (Persona 2): en el Primer Parcial solo se registra el rol "trabajador". -->
            <div class="form-group">
                <label for="rol">Soy...</label>
                <select id="rol" name="rol" required>
                    <option value="" disabled selected>Selecciona tu rol</option>
                    <option value="trabajador">Trabajador (Busco empleo)</option>
                    <option value="empleador">Empleador (Ofrezco empleo)</option>
                </select>
            </div>
            <!-- TODO (Persona 2): zona para mostrar los mensajes de error/éxito que devuelve la API. -->
            <p id="registro-mensaje" role="alert" aria-live="polite"></p>
            <nav aria-label="Opciones de acceso" style="margin-top: 20px;">
                <button class="botn-crear crear-cuenta" type="submit">
                    Registrarse
                </button>
                <a href="login.html" class="invitado" style="display: block; margin-top: 15px; text-align: center; text-decoration: none;">
                    Ya tengo una cuenta. Ingresar.
                </a>
            </nav>
        </form>
        <div style="text-align: center; margin: 40px 0 20px 0;">
            <p class="legal" style="font-size: 12px; color: #666;">
                Al registrarte, aceptas nuestros Términos y Condiciones.
            </p>
        </div>
        <div id="footer-placeholder"></div>
    </main>
    <script type="module" src="../assets/js/registro.js"></script>
    <script type="module">
        import { initFooter } from '../assets/js/components.js';
        initFooter();
    </script>
</body>
</html>
