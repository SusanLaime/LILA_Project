<!DOCTYPE html>
<html lang="es">

<head>
    <!--
        PROYECTO: LILA - Librería Laboral
        RESPONSABLE: Natalia
        MÓDULO: Registro de usuarios

        Permite crear cuentas de trabajador o empleador.
        Los datos se enviarán a POST /api/registro.
    -->

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Crea tu cuenta en LILA, la red laboral de Bolivia.">

    <title>LILA | Crear cuenta</title>

    <!-- Estilos existentes del proyecto -->
    <link rel="stylesheet"
          href="../assets/css/base/reset.css">

    <link rel="stylesheet"
          href="../assets/css/base/typography.css">

    <link rel="stylesheet"
          href="../assets/css/pages/login.css">

    <link rel="stylesheet"
          href="../assets/css/components/forms.css">
    <link rel="stylesheet"
          href="../assets/css/components/header.css">

    <link rel="stylesheet"
          href="../assets/css/utilities/responsive.css">
</head>

<body>

<main class="bienvenida-mvil auth-layout"
      aria-labelledby="registro-titulo">

    <!-- =========================================
         1. LOGOTIPO DE LILA
    ========================================== -->

    <div id="header-placeholder"></div>

    <!-- =========================================
         2. PRESENTACIÓN DEL FORMULARIO
    ========================================== -->

    <section aria-labelledby="registro-titulo">

        <h1 class="saludo" id="registro-titulo">
            Crear cuenta en LILA
        </h1>

        <p class="introducci-n">
            Únete a nuestra red laboral.
            Encuentra empleo o conecta con trabajadores
            en Bolivia.
        </p>

    </section>

    <!-- =========================================
         3. FORMULARIO DE REGISTRO

         IMPORTANTE:
         El ID registroForm es utilizado por registro.js
         para detectar cuándo se envía el formulario.
    ========================================== -->

    <form
        id="registroForm"
        class="registro-form"
        method="post"
        action="/api/registro">

        <!-- NOMBRE COMPLETO -->

        <div class="form-group">

            <label for="nombre">
                Nombre completo
            </label>

            <input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Ej. Ana Pérez"
                minlength="3"
                maxlength="100"
                autocomplete="name"
                required>

        </div>

        <!-- CARNET DE IDENTIDAD -->

        <div class="form-group">

            <label for="ci">
                Carnet de identidad (CI)
            </label>

            <input
                type="text"
                id="ci"
                name="ci"
                placeholder="Ej. 1234567"
                inputmode="numeric"
                pattern="[0-9]{5,10}"
                minlength="5"
                maxlength="10"
                title="Ingresa entre 5 y 10 números."
                required>

        </div>

        <!-- TELÉFONO -->

        <div class="form-group">

            <label for="telefono">
                Número de celular
            </label>

            <input
                type="tel"
                id="telefono"
                name="telefono"
                placeholder="Ej. 70012345"
                inputmode="numeric"
                pattern="[67][0-9]{7}"
                minlength="8"
                maxlength="8"
                autocomplete="tel"
                title="Debe tener 8 números y empezar con 6 o 7."
                required>

        </div>

        <!-- CONTRASEÑA -->

        <div class="form-group">

            <label for="password">
                Contraseña
            </label>
            <div class="password-field">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Mínimo 8 caracteres"
                    minlength="8"
                    autocomplete="new-password"
                    aria-describedby="password-ayuda"
                    required>
                <button class="password-toggle" type="button" id="toggle-password"
                    aria-controls="password" aria-pressed="false">
                    Mostrar
                </button>
            </div>

            <small id="password-ayuda">
                Utiliza al menos 8 caracteres.
            </small>

        </div>

        <!-- =====================================
             4. TIPO DE USUARIO

             El backend solamente acepta:
             trabajador o empleador.
        ====================================== -->

        <div class="form-group">

            <label for="rol">
                ¿Qué tipo de cuenta deseas crear?
            </label>

            <select
                id="rol"
                name="rol"
                required>

                <option value="" disabled selected>
                    Selecciona una opción
                </option>

                <option value="trabajador">
                    Trabajador - Busco empleo
                </option>

                <option value="empleador">
                    Empleador - Ofrezco empleo
                </option>

            </select>

        </div>

        <!-- =====================================
             5. CONSENTIMIENTO

             El backend exige consentimiento: true.
             Si no se acepta, no se permite registrar.
        ====================================== -->

        <div class="form-group grupo-consentimiento">

            <label class="consentimiento-label">

                <input
                    type="checkbox"
                    id="consentimiento"
                    name="consentimiento"
                    value="true"
                    required>

                <span>
                    Acepto el tratamiento de mis
                    datos personales.
                </span>

            </label>

        </div>

        <!-- =====================================
             6. MENSAJES DEL SISTEMA

             Aquí registro.js mostrará mensajes como:
             - Cuenta creada correctamente.
             - El CI ya está registrado.
             - No se pudo conectar al servidor.
        ====================================== -->

        <p
            id="registro-mensaje"
            role="alert">
        </p>

        <!-- =====================================
             7. BOTÓN PARA CREAR CUENTA
        ====================================== -->

        <div class="acciones-registro">

            <button
                type="submit"
                class="botn-crear crear-cuenta">

                Crear mi cuenta

            </button>

            <!-- Enlace a la pantalla de inicio de sesión -->

            <a
                href="login.html"
                class="invitado">

                ¿Ya tienes una cuenta? Inicia sesión

            </a>

        </div>

    </form>

    <!-- =========================================
         8. PIE DE PÁGINA
    ========================================== -->

    <div id="footer-placeholder"></div>

</main>

<!-- =========================================
     9. JAVASCRIPT DEL REGISTRO

     Este archivo recoge los datos del formulario
     y los envía al backend mediante pedirApi().
========================================== -->

<script
    type="module"
    src="../assets/js/registro.js">
</script>

<!-- Cargar el pie de página compartido -->

<script type="module">

    import { initFooter, initHeader }
        from '../assets/js/components.js';

    initHeader('', '');
    initFooter();

</script>

</body>
</html>
