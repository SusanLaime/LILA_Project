<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar - LILA</title>
    <link rel="stylesheet" href="../assets/css/components/navbar.css">
</head>
<body>

    <header class="navbar-trabajador">
        <div class="navbar-container">
            <!-- Logo e Identidad -->
            <a href="../website/trabajador/home.html" class="navbar-brand">
                <img src="../public/L-logo-oficial.png" alt="LILA Logo" class="navbar-logo" />
            </a>

            <!-- Buscador Central Responsivo -->
            <div class="navbar-search">
                <div class="search-input-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" placeholder="Buscar trabajos..." />
                </div>
            </div>

            <!-- Avatar de Perfil -->
            <div class="navbar-user">
                <div class="profile-avatar-circle" title="Perfil de usuario">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm0 14c-2.03 0-3.8-.85-5.05-2.2.03-1.67 3.37-2.58 5.05-2.58 1.67 0 5.02.91 5.05 2.58C15.8 19.15 14.03 20 12 20z" />
                    </svg>
                </div>
            </div>
        </div>
    </header>

</body>
</html>
