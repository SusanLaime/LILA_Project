<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LILA — Page under construction</title>
    <style>
        :root {
            color: #272348;
            background: #fff;
            font-family: Poppins, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            background: #fff;
        }

        main {
            display: grid;
            justify-items: center;
            gap: 28px;
            padding: 32px;
            text-align: center;
        }

        img {
            width: min(220px, 60vw);
            height: auto;
        }

        h1 {
            margin: 0;
            color: #272348;
            font-size: clamp(1.8rem, 5vw, 3rem);
        }
    </style>
</head>
<body>
    <main>
        <h1>Page under construction</h1>
        <img src="public/L-logo-oficial.png" alt="LILA" />
    </main>
</body>
</html>
