<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <meta name="description" content="Mis Ofertas - LILA" />
    <link rel="stylesheet" href="../../assets/css/base/reset.css" />
    <link rel="stylesheet" href="../../assets/css/base/typography.css" />
    <link rel="stylesheet" href="../../assets/css/pages/buscar.css" />
    <link rel="stylesheet" href="../../assets/css/utilities/responsive.css" />
    <title>LILA | Mis Ofertas</title>

    <!-- Bootstrap CSS for Navbar -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="../../assets/css/components/header.css">
</head>
<body>
    <div id="header-placeholder"></div>
    <main class="buscar-oportunidades">
        

        <section style="margin-top: 20px;">
            <article class="tarjeta-vendedor" style="cursor: pointer;" onclick="window.location.href='oferta.html'">
                <h2 class="puesto-vendedor">Pintor de brocha gorda</h2>
                <p class="empresa-vendedor">Publicado hace 2 días</p>
                <p class="meta-vendedor">Bs 150 / día · Quillacollo</p>
                <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 10px;">
                    <span class="etiquetas-vendedor">
                        <span class="tags-vendedor" style="background-color: #f2edfa; color: #272348;">Activa</span>
                        <span class="tags-vendedor" style="background-color: #272348; color: #fff;">3 Postulantes</span>
                    </span>
                    <div style="display: flex; gap: 10px;">
                        <button onclick="event.stopPropagation(); alert('Editar oferta');" style="background: transparent; border: none; font-size: 16px; cursor: pointer;" title="Editar">✏️</button>
                        <button onclick="event.stopPropagation(); alert('Eliminar oferta');" style="background: transparent; border: none; font-size: 16px; cursor: pointer;" title="Eliminar">🗑️</button>
                    </div>
                </div>
            </article>

            <article class="tarjeta-vendedor" style="margin-top: 20px; opacity: 0.7;">
                <h2 class="puesto-vendedor">Ayudante de carga</h2>
                <p class="empresa-vendedor">Publicado hace 1 mes</p>
                <p class="meta-vendedor">Bs 100 / día · Cercado</p>
                <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 10px;">
                    <span class="etiquetas-vendedor">
                        <span class="tags-vendedor" style="background-color: #d6cee2; color: #6d6b7c;">Completada</span>
                    </span>
                    <div style="display: flex; gap: 10px;">
                        <button onclick="event.stopPropagation(); window.location.href='resenas.html';" style="background: transparent; border: none; font-size: 16px; cursor: pointer;" title="Calificar Trabajador">⭐</button>
                    </div>
                </div>
            </article>
        </section>
        <div id="footer-placeholder"></div>
    </main>

    <!-- Bootstrap JS for Navbar -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>


    <!-- Initialize Dynamic Header and Footer -->
    <script type="module">
        import { initHeader, initFooter } from '../../assets/js/components.js';
        const role = window.location.pathname.includes('empleador') ? 'empleador' : 'trabajador';
        initHeader(role, 'verified');
        initFooter();
    </script>
</body>
</html>
