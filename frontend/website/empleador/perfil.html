<!DOCTYPE html>
<html lang="es">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <meta name="description" content="Perfil de Empleador - LILA" />
    <link rel="stylesheet" href="../../assets/css/base/reset.css" />
    <link rel="stylesheet" href="../../assets/css/base/typography.css" />
    <link rel="stylesheet" href="../../assets/css/pages/buscar.css" />
    <link rel="stylesheet" href="../../assets/css/utilities/responsive.css" />
    <title>LILA | Mi Perfil (Empleador)</title>

    <!-- Bootstrap CSS for Navbar -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="../../assets/css/components/header.css">
</head>

<body>
    <div id="header-placeholder"></div>
    <main class="buscar-oportunidades">
        

        <section style="margin-top: 20px;">
            <article style="text-align: center; max-width: 400px; margin: 0 auto;">
                <div class="avatar"
                    style="width: 180px; height: 180px; min-width: 180px; max-width: 180px; flex-shrink: 0; background-color: #d6cee2; border-radius: 50%; object-fit: cover; margin: 0 auto 15px auto; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: bold; color: #272348;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="70%" height="70%" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16">
                      <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                      <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
                    </svg>
                </div>
                <h2 style="font-size: 22px; color: #272348; margin-bottom: 5px;">Ana López</h2>
                <p style="color: #6d6b7c; font-size: 14px; margin-bottom: 10px;">Cochabamba</p>

                <div style="display: flex; justify-content: center; gap: 15px; margin-bottom: 20px;">
                    <span
                        style="background-color: #4CAF50; color: white; padding: 5px 10px; border-radius: 12px; font-size: 12px; font-weight: bold;">
                        ✓ Empleador Verificado
                    </span>
                    <span
                        style="background-color: #FFC107; color: #272348; padding: 5px 10px; border-radius: 12px; font-size: 12px; font-weight: bold;">
                        ★ 4.5 / 5
                    </span>
                </div>

                <hr style="border: 0; border-top: 1px solid #d6cee2; margin: 20px 0;">

                <h3 style="text-align: left; margin-bottom: 15px; color: #272348; font-size: 18px;">Resumen de Actividad
                </h3>

                <div style="display: flex; justify-content: space-between; text-align: center; margin-bottom: 20px;">
                    <div style="background-color: #f9f9f9; border-radius: 12px; padding: 15px; width: 45%;">
                        <h4 style="margin: 0; font-size: 24px; color: #272348;">12</h4>
                        <p style="margin: 5px 0 0 0; font-size: 12px; color: #6d6b7c;">Ofertas Publicadas</p>
                    </div>
                    <div style="background-color: #f9f9f9; border-radius: 12px; padding: 15px; width: 45%;">
                        <h4 style="margin: 0; font-size: 24px; color: #272348;">8</h4>
                        <p style="margin: 5px 0 0 0; font-size: 12px; color: #6d6b7c;">Trabajos Completados</p>
                    </div>
                </div>

            </article>
        </section>
        <div id="footer-placeholder"></div>
        
    </main>

    <!-- Bootstrap JS for Navbar -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>


    <!-- Initialize Dynamic Header and Footer -->
    <script type="module">
        import { initHeader, initFooter } from '../../assets/js/components.js';
        const role = window.location.pathname.includes('empleador') ? 'empleador' : 'trabajador';
        initHeader(role, 'verified');
        initFooter();
    </script>
</body>

</html>
