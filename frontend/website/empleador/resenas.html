<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <meta name="description" content="Calificar Trabajador - LILA" />
    <link rel="stylesheet" href="../../assets/css/base/reset.css" />
    <link rel="stylesheet" href="../../assets/css/base/typography.css" />
    <link rel="stylesheet" href="../../assets/css/pages/buscar.css" />
    <link rel="stylesheet" href="../../assets/css/components/forms.css" />
    <link rel="stylesheet" href="../../assets/css/utilities/responsive.css" />
    <title>LILA | Calificar</title>

    <!-- Bootstrap CSS for Navbar -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="../../assets/css/components/header.css">
    <link rel="stylesheet" href="../../assets/css/pages/profile.css">
</head>
<body>
    <div id="header-placeholder"></div>
    <main class="buscar-oportunidades">
        

        <section style="margin-top: 20px;">
            <p class="review-prompt">
                ¿Cómo fue el trabajo de <strong>Juan Pérez</strong> en "Ayudante de carga"?
            </p>
            <form class="registro-form" action="ofertas.html" method="get">
                
                <div class="review-stars">
                    <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
                </div>
                
                <div class="form-group">
                    <label for="comentario">Comentario (Opcional)</label>
                    <textarea id="comentario" name="comentario" rows="4" placeholder="Ej. Buen trabajo, muy puntual..."></textarea>
                </div>
                
                <nav aria-label="Opciones de calificación" class="review-actions">
                    <button class="btn-submit-review" type="submit">
                        Enviar Calificación
                    </button>
                    <a href="ofertas.html" class="invitado btn-cancel-review">
                        Cancelar
                    </a>
                </nav>
            </form>
        </section>
        <div id="footer-placeholder"></div>
    </main>

    <!-- Bootstrap JS for Navbar -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>


    <!-- Initialize Dynamic Header and Footer -->
    <script type="module">
        import { initHeader, initFooter } from '../../assets/js/components.js';
        const role = window.location.pathname.includes('empleador') ? 'empleador' : 'trabajador';
        initHeader(role, 'verified');
        initFooter();
    </script>
</body>
</html>
