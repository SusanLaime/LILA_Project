<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buscar oportunidades | Lila</title>
    <link rel="stylesheet" href="../../assets/css/base/reset.css">
    <link rel="stylesheet" href="../../assets/css/base/typography.css">
    <link rel="stylesheet" href="../../assets/css/pages/buscar.css">
    <link rel="stylesheet" href="../../assets/css/utilities/responsive.css">

    <!-- Bootstrap CSS for Navbar -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="../../assets/css/components/header.css">
</head>

<body>
    <div id="header-placeholder"></div>
    <main class="buscar-oportunidades">
        
        <form class="buscar" role="search" action="#" method="get">
            <label class="text-wrapper">
                <span aria-hidden="true">⌕</span>
                <input type="search" name="q" placeholder="Cargo, ciudad o categoría"
                    aria-label="Buscar por cargo, ciudad o categoría">
            </label>
        </form>
        <button class="filtro" type="button" aria-pressed="false" aria-label="Filtrar por ubicación: Cochabamba">
            <span class="ubicaci-n">Cochabamba</span>
        </button>
        <button class="div" type="button" aria-pressed="false" aria-label="Filtrar por categoría: Ventas">
            <span class="categor-a">Ventas</span>
        </button>
        <section aria-label="Resultados de oportunidades">
            <article class="tarjeta-vendedor">
                <h2 class="puesto-vendedor">Vendedor temporal de feria</h2>
                <p class="empresa-vendedor">Lila Connect · Cala Cala</p>
                <p class="meta-vendedor">Bs 2.800 / mes · Presencial</p>
                <span class="etiquetas-vendedor">
                    <span class="tags-vendedor">Ventas · Trato al cliente</span>
                </span>
                <a href="oferta_detalle.html" class="aplicar-vendedor" style="text-decoration:none; display:flex; justify-content:center; align-items:center;" aria-label="Ver Detalles Vendedor temporal de feria">
                    <span class="aplicar-texto">Ver Detalles</span>
                </a>
            </article>
            <article class="tarjeta-plomero-para">
                <h2 class="puesto-plomero-para">Plomero para arreglo específico</h2>
                <p class="empresa-plomero-para">Servicios Sarco · Cochabamba</p>
                <p class="meta-plomero-para">Bs 450 total · Por proyecto</p>
                <span class="etiquetas-plomero">
                    <span class="tags-plomero-para">Plomería · Mantenimiento</span>
                </span>
                <a href="oferta_detalle.html" class="aplicar-plomero-para" style="text-decoration:none; display:flex; justify-content:center; align-items:center;"
                    aria-label="Ver Detalles Plomero para arreglo específico">
                    <span class="aplicar-texto-2">Ver Detalles</span>
                </a>
            </article>
        </section>
        <div id="footer-placeholder"></div>
    </main>
    <script src="../../assets/js/shell.js"></script>

    <!-- Bootstrap JS for Navbar -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>


    <!-- Initialize Dynamic Header and Footer -->
    <script type="module">
        import { initHeader, initFooter } from '../../assets/js/components.js';
        const role = window.location.pathname.includes('empleador') ? 'empleador' : 'trabajador';
        initHeader(role, 'verified');
        initFooter();
    </script>
</body>

</html>
